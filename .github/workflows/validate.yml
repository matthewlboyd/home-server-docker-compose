name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install validation tools
        run: |
          python -m pip install 'PyYAML==6.0.3' 'ansible-core==2.19.4'
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Test backup recovery and image rollout
        run: python -m unittest discover -s tests -v
      - name: Check playbooks and shell scripts
        run: |
          for playbook in ansible/*.yml; do
            if [ "$playbook" != ansible/requirements.yml ]; then
              ansible-playbook -i 'localhost,' "$playbook" --syntax-check
            fi
          done
          bash -n scripts/backup-server
          git diff --check
      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44.252.6 renovate-config-validator --strict renovate.json
      - name: Validate Compose without private configuration
        run: |
          docker compose --env-file .env.example config --quiet
          LAN_IP=192.0.2.10 ADMIN_PASSWORD=ci-placeholder RCON_PASSWORD=ci-placeholder \
            docker compose --env-file zomboid/.env.example --file zomboid/compose.yaml config --quiet
      - name: Verify pinned images are published for this server
        run: |
          python - <<'PY'
          import json, subprocess, yaml
          compose = yaml.safe_load(open('compose.yaml'))
          for service in compose['services'].values():
              image = service['image']
              result = subprocess.check_output(['docker', 'buildx', 'imagetools', 'inspect', '--raw', image], text=True)
              manifest = json.loads(result)
              if 'manifests' in manifest:
                  assert any(item.get('platform', {}).get('os') == 'linux' and
                             item.get('platform', {}).get('architecture') == 'amd64'
                             for item in manifest['manifests']), image
          PY
