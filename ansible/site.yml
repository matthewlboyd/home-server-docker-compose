---
- name: Manage the homelab host baseline
  hosts: homelab
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify the supported operating system
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
          - ansible_facts.distribution_version is version("24.04", ">=")
        fail_msg: This playbook supports Ubuntu 24.04 or newer.

    - name: Verify required inventory variables
      ansible.builtin.assert:
        that:
          - server_timezone | length > 0
          - (lan_subnet | ansible.utils.ipaddr) != false
          - pihole_api_url | length > 0
        fail_msg: Set server_timezone, lan_subnet, and pihole_api_url in the private inventory.

  tasks:
    - name: Install host administration packages
      ansible.builtin.apt:
        name:
          - cockpit
          - nut-client
          - nut-server
          - restic
          - usbutils
          - ufw
          - unattended-upgrades
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Set the host timezone
      community.general.timezone:
        name: "{{ server_timezone }}"

    - name: Enable IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        sysctl_file: /etc/sysctl.d/99-tailscale.conf
        reload: true

    - name: Enable IPv6 forwarding
      ansible.posix.sysctl:
        name: net.ipv6.conf.all.forwarding
        value: "1"
        state: present
        sysctl_file: /etc/sysctl.d/99-tailscale.conf
        reload: true

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Set the default incoming firewall policy
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set the default outgoing firewall policy
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Set the default routed firewall policy
      community.general.ufw:
        direction: routed
        policy: deny

    - name: Allow traffic arriving through Tailscale
      community.general.ufw:
        rule: allow
        direction: in
        interface: tailscale0
        comment: Tailscale

    - name: Allow SSH from the home LAN
      community.general.ufw:
        rule: allow
        src: "{{ lan_subnet }}"
        port: "22"
        proto: tcp
        comment: SSH from home LAN

    - name: Allow direct Tailscale connections
      community.general.ufw:
        rule: allow
        port: "41641"
        proto: udp
        comment: Tailscale direct connections

    - name: Enable the firewall
      community.general.ufw:
        state: enabled
        logging: low

    - name: Enable Cockpit socket activation
      ansible.builtin.systemd_service:
        name: cockpit.socket
        enabled: true
        state: started

    - name: Check whether NUT is ready for configuration
      ansible.builtin.stat:
        path: /etc/nut
      register: nut_config_directory

    - name: Preview initial NUT installation
      ansible.builtin.debug:
        msg: NUT will be configured after its packages are installed during the apply run.
      changed_when: true
      when:
        - ansible_check_mode
        - not nut_config_directory.stat.exists

    - name: Configure UPS monitoring
      ansible.builtin.include_tasks: tasks/nut.yml
      when: not ansible_check_mode or nut_config_directory.stat.exists

    - name: Manage Pi-hole blocklists
      ansible.builtin.include_tasks: tasks/pihole-lists.yml

  handlers:
    - name: Refresh Pi-hole gravity
      ansible.builtin.uri:
        url: "{{ pihole_api_url }}/action/gravity"
        method: POST
        headers:
          X-FTL-SID: "{{ pihole_auth_response.json.session.sid }}"
        status_code: 200
        return_content: false
        timeout: "{{ pihole_api_timeout }}"
      changed_when: true
      no_log: true

    - name: Restart NUT server
      ansible.builtin.systemd_service:
        name: nut-server.service
        enabled: true
        state: restarted
      listen: Restart NUT

    - name: Restart NUT monitor
      ansible.builtin.systemd_service:
        name: nut-monitor.service
        enabled: true
        state: restarted
      listen: Restart NUT
