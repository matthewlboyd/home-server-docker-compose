# Docker Standalone stack. Configure variables in Portainer or a local .env.
# Required variables and host configuration are documented in README.md.

x-logging: &rotated-logs
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  socket-proxy:
    image: "${SOCKET_PROXY_IMAGE:?Set SOCKET_PROXY_IMAGE to a pinned LinuxServer socket-proxy image}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      NETWORKS: "1"
      PING: "1"
      VERSION: "1"
      # Only GET/HEAD requests; container lifecycle operations remain disabled.
      POST: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_RESTARTS: "0"
      ALLOW_PAUSE: "0"
      ALLOW_UNPAUSE: "0"
      LOG_LEVEL: warning
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    # No published port. Only Traefik joins this private control network.
    networks:
      - docker-api
    logging: *rotated-logs

  traefik:
    container_name: traefik
    image: "${TRAEFIK_IMAGE:?Set TRAEFIK_IMAGE to a tested image reference}"
    restart: unless-stopped
    depends_on:
      - socket-proxy
    dns:
      - 1.1.1.1
      - 1.0.0.1
    command:
      - "--global.checkNewVersion=true"
      - "--global.sendAnonymousUsage=true"
      - "--entrypoints.http.address=:80"
      - "--entrypoints.https.address=:443"
      - "--entrypoints.http.http.redirections.entrypoint.to=https"
      - "--entrypoints.http.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.http.http.redirections.entrypoint.permanent=true"
      # Cloudflare's published IPv4/IPv6 ranges, checked 2026-09-08.
      # This trusts forwarded headers; it does not restrict origin access.
      - "--entrypoints.https.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      - "--api=true"
      - "--log=true"
      - "--log.level=INFO"
      # Docker rotates stdout access logs using x-logging.
      - "--accesslog=true"
      - "--accesslog.bufferingsize=100"
      - "--accesslog.filters.statuscodes=400-599"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - '--providers.docker.defaultrule=Host(`{{ index .Labels "com.docker.compose.service" }}.${DOMAINNAME:?Set DOMAINNAME}`)'
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/rules"
      - "--providers.file.watch=true"
      - "--certificatesresolvers.dns-cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.dns-cloudflare.acme.email=${CLOUDFLARE_EMAIL:?Set CLOUDFLARE_EMAIL}"
      - "--certificatesresolvers.dns-cloudflare.acme.caserver=${TRAEFIK_ACME_CASERVER:?Set the ACME directory URL}"
      - "--certificatesresolvers.dns-cloudflare.acme.storage=/acme.json"
      - "--certificatesresolvers.dns-cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.dns-cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53"
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - type: bind
        source: "${DATA_DIR:?Set DATA_DIR to an absolute host data directory}/traefik2/rules"
        target: /rules
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DATA_DIR}/traefik2/acme/acme.json"
        target: /acme.json
        bind:
          create_host_path: false
      - type: bind
        source: "${DATA_DIR}/shared"
        target: /shared
        read_only: true
        bind:
          create_host_path: false
    environment:
      # Token permissions: Zone Read and DNS Edit for the configured domain.
      CF_DNS_API_TOKEN: "${CLOUDFLARE_DNS_API_TOKEN:?Set the scoped Cloudflare DNS API token}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-rtr.entrypoints=https"
      - 'traefik.http.routers.traefik-rtr.rule=Host(`traefik.${DOMAINNAME}`)'
      - "traefik.http.routers.traefik-rtr.tls=true"
      - "traefik.http.routers.traefik-rtr.tls.domains[0].main=${DOMAINNAME}"
      - "traefik.http.routers.traefik-rtr.tls.domains[0].sans=*.${DOMAINNAME}"
      - "traefik.http.routers.traefik-rtr.tls.certresolver=dns-cloudflare"
      - "traefik.http.routers.traefik-rtr.service=api@internal"
      - "traefik.http.routers.traefik-rtr.middlewares=chain-basic-auth@file"
    networks:
      - default
      - docker-api
    logging: *rotated-logs

  portainer:
    container_name: portainer
    image: "${PORTAINER_IMAGE:?Set PORTAINER_IMAGE to a tested image reference}"
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    volumes:
      # Portainer requires Docker management access.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${DATA_DIR}/portainer/data"
        target: /data
        bind:
          create_host_path: false
    environment:
      TZ: "${TZ:?Set TZ to an IANA time zone}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer-rtr.entrypoints=https"
      - 'traefik.http.routers.portainer-rtr.rule=Host(`portainer.${DOMAINNAME}`)'
      - "traefik.http.routers.portainer-rtr.tls=true"
      - "traefik.http.routers.portainer-rtr.middlewares=chain-no-auth@file"
      - "traefik.http.routers.portainer-rtr.service=portainer-svc"
      - "traefik.http.services.portainer-svc.loadbalancer.server.port=9000"
    logging: *rotated-logs

  pihole:
    container_name: pihole
    domainname: "${DOMAINNAME}"
    image: "${PIHOLE_IMAGE:?Set PIHOLE_IMAGE to a tested Pi-hole v6 image reference}"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # SERVER_IP must be the server's LAN IPv4 address, not the public DDNS IP.
    # The web interface is routed through Traefik.
    ports:
      - "${SERVER_IP:?Set SERVER_IP to the server LAN IPv4 address}:53:53/tcp"
      - "${SERVER_IP}:53:53/udp"
    # Remove NET_ADMIN if DHCP and IPv6 Router Advertisements are unused.
    cap_add:
      - NET_ADMIN
    volumes:
      - type: bind
        source: "${DATA_DIR}/pihole/pihole"
        target: /etc/pihole
        bind:
          create_host_path: false
      - type: bind
        source: "${DATA_DIR}/pihole/dnsmasq.d"
        target: /etc/dnsmasq.d
        bind:
          create_host_path: false
    environment:
      TZ: "${TZ}"
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD:?Set PIHOLE_PASSWORD}"
      FTLCONF_dns_rateLimit_count: "5000"
      FTLCONF_dns_rateLimit_interval: "60"
      # Enable after reviewing custom dnsmasq files for Pi-hole v6 compatibility.
      # FTLCONF_misc_etc_dnsmasq_d: "true"
    labels:
      - "traefik.enable=true"
      - 'traefik.http.routers.pihole.rule=Host(`pihole.${DOMAINNAME}`)'
      - "traefik.http.routers.pihole.entrypoints=https"
      - "traefik.http.routers.pihole.tls=true"
      - "traefik.http.routers.pihole.middlewares=chain-no-auth@file"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
    logging: *rotated-logs

  nginx:
    container_name: nginx
    domainname: "${DOMAINNAME}"
    image: "${NGINX_IMAGE:?Set NGINX_IMAGE to a tested image reference}"
    restart: unless-stopped
    volumes:
      - type: bind
        source: "${DATA_DIR}/website"
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    labels:
      - "traefik.enable=true"
      - 'traefik.http.routers.nginx.rule=Host(`${DOMAINNAME}`)'
      - "traefik.http.routers.nginx.entrypoints=https"
      - "traefik.http.routers.nginx.tls=true"
      - "traefik.http.routers.nginx.middlewares=chain-no-auth@file"
      - "traefik.http.services.nginx.loadbalancer.server.port=80"
    logging: *rotated-logs

  ddclient:
    container_name: ddclient
    image: "${DDCLIENT_IMAGE:?Set DDCLIENT_IMAGE to a tested image reference}"
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ}"
    volumes:
      - type: bind
        source: "${DATA_DIR}/ddclient"
        target: /config
        bind:
          create_host_path: false
    logging: *rotated-logs

networks:
  default: {}
  docker-api:
    internal: true
